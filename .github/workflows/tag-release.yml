name: Build tagged release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --concurrency=1

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Rename APK
        run: |
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          cp build/app/outputs/flutter-apk/app-release.apk "Schedulr-${SAFE_TAG}-android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Schedulr-*-android.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify iOS native integrations
        run: |
          python3 scripts/verify_ios_widget_project.py
          python3 scripts/verify_ios_native_dialog_bridge.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: >-
          flutter build ios --release --no-codesign
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Embed Widget extension and verify versions
        run: |
          set -euo pipefail
          RUNNER_APP="build/ios/iphoneos/Runner.app"
          WIDGET_APPEX="$RUNNER_APP/PlugIns/SchedulrWidget.appex"

          if [[ ! -d "$WIDGET_APPEX" ]]; then
            WIDGET_PRODUCT="$(find build/ios -type d -name 'SchedulrWidget.appex' ! -path "$WIDGET_APPEX" -print -quit)"
            if [[ -z "$WIDGET_PRODUCT" ]]; then
              xcodebuild \
                -project ios/Runner.xcodeproj \
                -target SchedulrWidget \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                CONFIGURATION_BUILD_DIR="$PWD/build/ios/iphoneos" \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                build
              WIDGET_PRODUCT="build/ios/iphoneos/SchedulrWidget.appex"
            fi
            test -d "$WIDGET_PRODUCT"
            mkdir -p "$RUNNER_APP/PlugIns"
            rm -rf "$WIDGET_APPEX"
            cp -R "$WIDGET_PRODUCT" "$WIDGET_APPEX"
          fi

          test -d "$WIDGET_APPEX"
          find "$RUNNER_APP/PlugIns" -maxdepth 1 -name '*.appex' -print

          RUNNER_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_APP/Info.plist")"
          RUNNER_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_APP/Info.plist")"
          test -n "$RUNNER_SHORT_VERSION"
          test -n "$RUNNER_BUILD_VERSION"

          set_or_add_plist_string() {
            local plist="$1"
            local key="$2"
            local value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }
          set_or_add_plist_string "$WIDGET_APPEX/Info.plist" CFBundleShortVersionString "$RUNNER_SHORT_VERSION"
          set_or_add_plist_string "$WIDGET_APPEX/Info.plist" CFBundleVersion "$RUNNER_BUILD_VERSION"

          WIDGET_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_APPEX/Info.plist")"
          WIDGET_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET_APPEX/Info.plist")"

          [[ "$RUNNER_SHORT_VERSION" == "$WIDGET_SHORT_VERSION" ]]
          [[ "$RUNNER_BUILD_VERSION" == "$WIDGET_BUILD_VERSION" ]]
          printf 'Runner/Widget version verified: %s (%s)\n' "$RUNNER_SHORT_VERSION" "$RUNNER_BUILD_VERSION"

      - name: Package unsigned IPA
        run: |
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry "Schedulr-${SAFE_TAG}-ios-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Schedulr-*-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Android APK 可直接安装。iOS IPA 未签名；包内含 SchedulrWidget.appex，需要为主应用和扩展分别配置含共享 App Group 的描述文件，先签名扩展再签名主应用。
