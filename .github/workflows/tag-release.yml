name: Build tagged release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          set -o pipefail
          flutter test --concurrency=1 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"

      - name: Upload Flutter test log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-test-log
          path: ${{ runner.temp }}/flutter-test.log
          if-no-files-found: ignore

      - name: Test Android widget parser
        run: ./android/gradlew -p android :app:testDebugUnitTest --tests 'app.schedulr.schedulr.widget.*'

      - name: Build release APK
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK metadata and signature mode
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            PACKAGE_INFO="$(apkanalyzer manifest application-id "$APK")"
            VERSION_NAME="$(apkanalyzer manifest version-name "$APK")"
            VERSION_CODE="$(apkanalyzer manifest version-code "$APK")"
            [[ "$PACKAGE_INFO" == "app.schedulr.schedulr" ]]
            [[ "$VERSION_NAME" == "${GITHUB_REF_NAME#v}" || "$VERSION_NAME" == "${GITHUB_REF_NAME#v}"* ]]
            [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
            printf 'APK metadata: package=%s versionName=%s versionCode=%s\n' "$PACKAGE_INFO" "$VERSION_NAME" "$VERSION_CODE"
          fi
          if [[ -n "${ANDROID_KEYSTORE_PATH:-}" ]]; then
            echo 'ANDROID_ARTIFACT_SIGNING=release' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_ARTIFACT_SIGNING=unsigned' >> "$GITHUB_ENV"
          fi
          printf 'Android artifact signing mode: %s\n' "${ANDROID_ARTIFACT_SIGNING:-unknown}"

      - name: Rename APK
        run: |
          set -euo pipefail
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          if [[ "${ANDROID_ARTIFACT_SIGNING:-unsigned}" == "release" ]]; then
            SUFFIX="android.apk"
          else
            SUFFIX="android-unsigned.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "Schedulr-${SAFE_TAG}-${SUFFIX}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Schedulr-*-android*.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify iOS native integrations
        run: |
          python3 scripts/verify_ios_widget_project.py
          python3 scripts/verify_ios_native_dialog_bridge.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Flutter iOS build configuration
        run: >-
          flutter build ios --release --config-only --no-codesign
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Assemble unsigned iOS app
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$PWD/build/ios/iphoneos"
          RUNNER_APP="$PACKAGE_ROOT/Runner.app"
          WIDGET_APPEX="$RUNNER_APP/PlugIns/SchedulrWidget.appex"
          rm -rf "$PACKAGE_ROOT"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PACKAGE_ROOT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            FLUTTER_BUILD_DIR="$PWD/build" \
            build

          test -d "$RUNNER_APP"
          test -x "$RUNNER_APP/Runner"
          test -s "$RUNNER_APP/Runner"
          test -s "$RUNNER_APP/Frameworks/App.framework/App"
          test -s "$RUNNER_APP/Frameworks/Flutter.framework/Flutter"
          test -d "$RUNNER_APP/Frameworks/App.framework/flutter_assets"

          if [[ ! -d "$WIDGET_APPEX" ]]; then
            WIDGET_PRODUCT="$PACKAGE_ROOT/SchedulrWidget.appex"
            test -d "$WIDGET_PRODUCT"
            mkdir -p "$RUNNER_APP/PlugIns"
            cp -R "$WIDGET_PRODUCT" "$WIDGET_APPEX"
          fi
          test -x "$WIDGET_APPEX/SchedulrWidget"
          find "$RUNNER_APP/PlugIns" -maxdepth 1 -name '*.appex' -print

          APP_VERSION="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | tr -d '[:space:]')"
          EXPECTED_SHORT_VERSION="${APP_VERSION%%+*}"
          EXPECTED_BUILD_VERSION="$GITHUB_RUN_NUMBER"
          test -n "$EXPECTED_SHORT_VERSION"
          test -n "$EXPECTED_BUILD_VERSION"

          set_or_add_plist_string() {
            local plist="$1"
            local key="$2"
            local value="$3"
            /usr/libexec/PlistBuddy -c "Set :$key $value" "$plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          }
          set_or_add_plist_string "$RUNNER_APP/Info.plist" CFBundleShortVersionString "$EXPECTED_SHORT_VERSION"
          set_or_add_plist_string "$RUNNER_APP/Info.plist" CFBundleVersion "$EXPECTED_BUILD_VERSION"
          set_or_add_plist_string "$WIDGET_APPEX/Info.plist" CFBundleShortVersionString "$EXPECTED_SHORT_VERSION"
          set_or_add_plist_string "$WIDGET_APPEX/Info.plist" CFBundleVersion "$EXPECTED_BUILD_VERSION"

          RUNNER_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_APP/Info.plist")"
          RUNNER_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_APP/Info.plist")"
          WIDGET_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_APPEX/Info.plist")"
          WIDGET_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET_APPEX/Info.plist")"

          [[ "$RUNNER_SHORT_VERSION" == "$EXPECTED_SHORT_VERSION" ]]
          [[ "$RUNNER_BUILD_VERSION" == "$EXPECTED_BUILD_VERSION" ]]
          [[ "$RUNNER_SHORT_VERSION" == "$WIDGET_SHORT_VERSION" ]]
          [[ "$RUNNER_BUILD_VERSION" == "$WIDGET_BUILD_VERSION" ]]

          UNCOMPRESSED_KB="$(du -sk "$RUNNER_APP" | cut -f1)"
          test "$UNCOMPRESSED_KB" -gt 10000
          printf 'Complete Runner.app verified: %s (%s), %s KB\n' \
            "$RUNNER_SHORT_VERSION" "$RUNNER_BUILD_VERSION" "$UNCOMPRESSED_KB"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          SAFE_TAG="${GITHUB_REF_NAME//\//-}"
          IPA="Schedulr-${SAFE_TAG}-ios-unsigned.ipa"
          rm -rf Payload "$IPA"
          mkdir -p Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload "$IPA"
          unzip -tq "$IPA"
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Runner'
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Frameworks/App.framework/App'
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/Frameworks/Flutter.framework/Flutter'
          unzip -l "$IPA" | grep -q 'Payload/Runner.app/PlugIns/SchedulrWidget.appex/SchedulrWidget'
          IPA_BYTES="$(stat -f%z "$IPA")"
          test "$IPA_BYTES" -gt 5000000
          printf 'Unsigned IPA verified: %s bytes\n' "$IPA_BYTES"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Schedulr-*-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Android APK：只有配置正式 keystore 时才是正式签名产物；未配置时文件名会标记为 `android-unsigned.apk`，需要安装前自行签名。
            iOS IPA 未签名；包内含 SchedulrWidget.appex，需要由同一 Apple Developer Team 为主应用和扩展分别配置含共享 App Group 的描述文件，先签名扩展再签名主应用。
